# P2P対局の Rust のワークスペース（通信プロセス peer/ と共通の取り決め protocol/rust、Windows の制限を確かめる
# Win32 API の呼び出し peer/win32、macOS のサンドボックスを掛ける関数の呼び出し peer/macos）。unsafe を書いてよいのは
# peer/win32 と peer/macos だけ（その2つのクレートは下の lints を継がない）。
# C++ のビルドは CMake（ENABLE_P2P_PLAY）が cargo を呼ぶ。Cargo.lock で依存の版を固定する。
[workspace]
resolver = "2"
members = ["protocol/rust", "peer", "peer/win32", "peer/macos"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"

[profile.release]
overflow-checks = true

# 合言葉の鍵の導出（Argon2id、64 MiB）は、最適化なしでは数秒かかる。デバッグのビルドと試験でも最適化して使う
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# 整数のオーバーフローの検査は自前のコード（ワークスペース）にだけ掛ける。依存のクレートはリリースでの通常の
# 振る舞い（検査なし）のままにする（依存の中の溢れで、主のタスクごと通信プロセスを終わらせない。監査 2026-11-13）
[profile.release.package."*"]
overflow-checks = false
