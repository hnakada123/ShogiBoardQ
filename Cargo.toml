# P2P対局の Rust のワークスペース（通信プロセス peer/ と共通の取り決め protocol/rust）。
# C++ のビルドは CMake（ENABLE_P2P_PLAY）が cargo を呼ぶ。Cargo.lock で依存の版を固定する。
[workspace]
resolver = "2"
members = ["protocol/rust", "peer"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"

[profile.release]
overflow-checks = true
