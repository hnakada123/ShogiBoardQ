name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v2026.03.04)"
        required: true
        type: string

permissions:
  contents: write

env:
  # Match the Qt SDK and the sources used to prepare bundled license notices.
  QT_VERSION: "6.7.3"
  QT_SOURCE_SHA256: "a3f1d257cbb14c6536585ffccf7c203ce7017418e1a0c2ed7c316c20c729c801"

jobs:
  compatibility-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Install Qt6
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125  # v4.4.1
        with:
          version: ${{ env.QT_VERSION }}
          modules: "qtcharts qtmultimedia"

      - name: Configure
        run: cmake -B build -S . -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release -DENABLE_WERROR=ON

      - name: Build
        run: cmake --build build --parallel 2

      - name: Compatibility Regression Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          cd build
          ctest -R "tst_settings_roundtrip|tst_kifconverter|tst_ki2converter|tst_csaconverter|tst_jkfconverter|tst_usiconverter|tst_usenconverter|tst_translation_files" \
            --output-on-failure --timeout 180

      - name: Upload Compatibility Logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-compatibility-logs
          if-no-files-found: ignore
          retention-days: 30
          path: |
            build/Testing/Temporary/LastTest.log
            build/CMakeFiles/CMakeOutput.log
            build/CMakeFiles/CMakeError.log

  qt-notices:
    needs: compatibility-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: actions/cache@v6
        with:
          path: build/qt-sources
          key: qt-sources-${{ env.QT_VERSION }}-${{ env.QT_SOURCE_SHA256 }}

      - name: Prepare bundled Qt license notices
        run: |
          python3 scripts/qt_licenses.py fetch --version "$QT_VERSION" \
            --sha256 "$QT_SOURCE_SHA256" --output build/qt-sources
          python3 scripts/qt_licenses.py prepare --version "$QT_VERSION" \
            --archive "build/qt-sources/qt-everywhere-src-${QT_VERSION}.tar.xz" \
            --sha256 "$QT_SOURCE_SHA256" \
            --source-url "https://download.qt.io/archive/qt/${QT_VERSION%.*}/${QT_VERSION}/single/qt-everywhere-src-${QT_VERSION}.tar.xz" \
            --provenance "Official Qt ${QT_VERSION} SDK installed by install-qt-action/aqt; no ShogiBoardQ patches to Qt. Build scripts and configuration are included in the Qt source archive." \
            --output build/qt-licenses

      - name: Upload license documents for packaging jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qt-license-documents
          path: build/qt-licenses/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  build-linux:
    needs: [compatibility-check, qt-notices]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: actions/download-artifact@v8
        with:
          name: qt-license-documents
          path: build/qt-licenses

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 imagemagick

      - name: Install Qt6
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125  # v4.4.1
        with:
          version: ${{ env.QT_VERSION }}
          modules: "qtcharts qtmultimedia"

      - name: Build Linux ZIP
        run: |
          chmod +x scripts/build-linux.sh
          ./scripts/build-linux.sh

      - name: Prepare Linux artifact
        run: |
          mkdir -p dist
          mv ShogiBoardQ-linux.zip dist/

      - name: Upload Linux artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-package-linux
          path: dist/*
          retention-days: 90

  build-macos:
    needs: [compatibility-check, qt-notices]
    runs-on: macos-15  # macOS 26 SDK には AGL が無く Qt 6.7 がリンクできない
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: actions/download-artifact@v8
        with:
          name: qt-license-documents
          path: build/qt-licenses

      - name: Install dependencies
        run: brew install create-dmg

      - name: Install Qt6
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125  # v4.4.1
        with:
          version: ${{ env.QT_VERSION }}
          modules: "qtcharts qtmultimedia"

      # 証明書はビルドの前に読み込み、署名の ID をスクリプトに渡す。スクリプトがアプリ・Hayanagi・DMG を
      # 署名し、--notarize のときは DMG を公証・ステープルしてから配布 ZIP を作る。
      - name: Import signing certificate (optional)
        id: signing
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          set -euo pipefail
          if [[ -z "${MACOS_CERT_P12_BASE64}" || -z "${MACOS_CERT_PASSWORD}" || -z "${MACOS_SIGN_IDENTITY}" ]]; then
            echo "macOS signing secrets are not configured. Using ad hoc signing."
            exit 0
          fi

          CERT_PATH="$RUNNER_TEMP/signing.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "${MACOS_CERT_P12_BASE64}" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "${MACOS_CERT_PASSWORD}" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Build DMG and ZIP
        env:
          SIGNING_ENABLED: ${{ steps.signing.outputs.enabled }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x scripts/build-macos.sh
          args=()
          if [[ "${SIGNING_ENABLED:-}" == "true" ]]; then
            args+=(--sign-identity "${MACOS_SIGN_IDENTITY}")
            if [[ -n "${APPLE_ID}" && -n "${APPLE_TEAM_ID}" && -n "${APPLE_APP_PASSWORD}" ]]; then
              args+=(--notarize)
            else
              echo "Notarization secrets are not fully configured. Skipping notarization."
            fi
          fi
          ./scripts/build-macos.sh ${args[@]+"${args[@]}"}

      - name: Remove signing keychain
        if: always() && steps.signing.outputs.enabled == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db"

      # 手作業のリリースと同じく、DMG・Hayanagi・問題集を入れた配布 ZIP をそのまま添付する。
      - name: Prepare macOS artifact
        run: |
          mkdir -p dist
          mv ShogiBoardQ-macos.zip dist/

      - name: Upload macOS artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-package-macos
          path: dist/*
          retention-days: 90

  build-windows:
    needs: [compatibility-check]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Install Qt6
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125  # v4.4.1
        with:
          version: ${{ env.QT_VERSION }}
          modules: "qtcharts qtmultimedia"

      # 手順書と同じく Developer PowerShell for VS の環境でスクリプトを実行する（cl・Ninja・
      # VCToolsRedistDir が揃い、ランナーに入っているツールでジェネレータが変わらない）。
      - name: Build deploy directory
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) { throw "Visual Studio with the C++ tools was not found." }
          Import-Module (Join-Path $vsPath "Common7\Tools\Microsoft.VisualStudio.DevShell.dll")
          Enter-VsDevShell -VsInstallPath $vsPath -SkipAutomaticLocation -DevCmdArguments "-arch=x64 -host_arch=x64"
          .\scripts\build-windows.ps1 -SkipZip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # ZIP にする前に、Hayanagi と CLI を含むすべての exe に署名する。
      - name: Optional Windows signing
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          WINDOWS_SIGN_TIMESTAMP_URL: ${{ secrets.WINDOWS_SIGN_TIMESTAMP_URL }}
        run: |
          if (-not $env:WINDOWS_CERT_PFX_BASE64 -or -not $env:WINDOWS_CERT_PASSWORD) {
            Write-Host "Windows signing secrets are not configured. Skipping signing."
            exit 0
          }

          # signtool は Windows SDK にあり、通常の PATH には入っていない。
          $signtool = Get-ChildItem -Path (Join-Path ${env:ProgramFiles(x86)} "Windows Kits\10\bin") -Filter signtool.exe -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.Directory.Name -eq "x64" -and $_.Directory.Parent.Name -match '^\d+(\.\d+)+$' } |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending |
            Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe was not found in the Windows SDK." }
          Write-Host "signtool: $($signtool.FullName)"

          $certPath = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          $timestamp = if ($env:WINDOWS_SIGN_TIMESTAMP_URL) { $env:WINDOWS_SIGN_TIMESTAMP_URL } else { "http://timestamp.digicert.com" }

          try {
            foreach ($exe in Get-ChildItem -Path deploy -Filter *.exe -Recurse) {
              & $signtool.FullName sign /fd SHA256 /tr $timestamp /td SHA256 /f $certPath /p $env:WINDOWS_CERT_PASSWORD $exe.FullName
              if ($LASTEXITCODE -ne 0) { throw "Signing failed: $($exe.FullName)" }
              & $signtool.FullName verify /pa $exe.FullName
              if ($LASTEXITCODE -ne 0) { throw "Signature verification failed: $($exe.FullName)" }
            }
          } finally {
            Remove-Item -Force $certPath -ErrorAction SilentlyContinue
          }

      # scripts/build-windows.ps1 の ZIP 作成と同じ形（deploy の中身を ZIP の直下に置く）にし、
      # 手作業の Release・ホームのダウンロードボタンと同じ名前で添付する。
      - name: Package Windows artifact
        shell: pwsh
        run: |
          $zipName = "ShogiBoardQ-windows.zip"
          if (Test-Path $zipName) { Remove-Item $zipName -Force }
          Compress-Archive -Path "deploy\*" -DestinationPath $zipName
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Move-Item $zipName dist\

      - name: Upload Windows artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-package-windows
          path: dist/*
          retention-days: 90

  checksums-and-sbom:
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-package-*
          path: release-assets
          merge-multiple: true

      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b ./
          ./syft version

      - name: Generate SHA256 and SBOM
        run: |
          # Keep verification reports as CI artifacts, outside the release upload set.
          ./syft dir:release-assets -o spdx-json > SBOM.spdx.json
          cd release-assets
          find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt

      - name: Retain verification reports in CI
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-verification
          path: |
            release-assets/SHA256SUMS.txt
            SBOM.spdx.json
          retention-days: 90

  publish-release:
    needs: [build-linux, build-macos, build-windows, checksums-and-sbom]
    runs-on: ubuntu-latest
    steps:
      - name: Download product packages
        uses: actions/download-artifact@v8
        with:
          pattern: release-package-*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          fi
          VERSION="${TAG#v}"

          cat > release-notes.md <<'EOF'
          **ライセンス文書 / License documents:**
          Qt のライセンス本文・著作権表示・使用バージョンと取得元の情報は、
          アプリ内（Linux は AppImage 内）と「バージョン情報」画面で参照できます。
          Qt license notices and source information are included inside the product package.
          EOF

          # Publish only the named product packages. Qt sources, source/build metadata,
          # checksums, SBOMs and CI logs must never become separate release assets.
          ASSETS=(
            "release-assets/ShogiBoardQ-linux.zip"
            "release-assets/ShogiBoardQ-macos.zip"
            "release-assets/ShogiBoardQ-windows.zip"
          )
          for asset in "${ASSETS[@]}"; do
            test -s "$asset"
          done

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            gh release view "$TAG" --json body --jq .body > existing-notes.md
            if ! grep -Fq '**ライセンス文書 / License documents:**' existing-notes.md; then
              printf '\n\n' >> existing-notes.md
              cat release-notes.md >> existing-notes.md
              gh release edit "$TAG" --notes-file existing-notes.md
            fi
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "ShogiBoardQ ${VERSION}" \
              --generate-notes --notes-file release-notes.md
          fi

          echo "Published release assets:"
          printf ' - %s\n' "${ASSETS[@]}"
