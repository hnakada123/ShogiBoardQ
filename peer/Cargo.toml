[package]
name = "shogiboardq-peer"
description = "ShogiBoardQ P2P communication process (discovery, offers, NAT traversal, frame transport)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
sbq-protocol = { path = "../protocol/rust" }
# 実装仕様 2.2節で確かめた版（libp2p-kad 0.48.0・libp2p-gossipsub 0.49.5。Cargo.lock で固定）に合う 0.56 系に固定する。
# 既定の機能を切り、使う通信方式とプロトコルだけを有効にする
libp2p = { version = "=0.56.0", default-features = false, features = [
    "tokio", "tcp", "quic", "noise", "yamux", "identify", "ping", "relay", "dcutr",
    "autonat", "kad", "gossipsub", "request-response", "macros", "ed25519",
] }
libp2p-stream = "=0.4.0-alpha"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync", "time"] }
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
rand = "0.8"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"
seccompiler = "0.5"
nix = { version = "0.29", default-features = false, features = ["process", "resource", "signal", "socket"] }
libc = "0.2"
